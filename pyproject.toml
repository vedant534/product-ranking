[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "session-product-ranking"
version = "0.1.0"
description = "Real-time session-based product ranking for anonymous users"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "pyarrow>=14,<22",
    "PyYAML>=6.0,<7",
    "streamlit>=1.50,<2",
    "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["data", "artifacts", "models", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
